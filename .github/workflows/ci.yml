name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
      - name: Type check
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q
      - name: Demo
        env:
          PYTHONPATH: src
        run: python -m gemsim demo --quiet --out artifacts-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-trace-${{ matrix.os }}
          path: artifacts-ci/
